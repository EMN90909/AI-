      - name: Register API settings inside Backlot
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          server=Path("backlot/server.py")
          body=server.read_text(encoding="utf-8")
          needle='    app = FastAPI(title="Backlot", docs_url=None, redoc_url=None, lifespan=_lifespan)'
          patch=needle+'\n    from chatgpt_bridge.settings_ui import router as api_settings_router\n    app.include_router(api_settings_router)'
          if 'app.include_router(api_settings_router)' not in body:
              assert needle in body, "Backlot application structure changed"
              server.write_text(body.replace(needle,patch),encoding="utf-8")
          page=Path("backlot/ui/index.html")
          html=page.read_text(encoding="utf-8")
          if 'href="/settings/api"' not in html:
              needle2='    <span class="live idle" id="liveBadge">'
              assert needle2 in html, "Backlot library header changed"
              html=html.replace(needle2,'    <a href="/settings/api" style="padding:8px 12px;border:1px solid #5b6480;border-radius:8px;text-decoration:none">API</a>\n'+needle2)
              page.write_text(html,encoding="utf-8")
          gi=Path(".gitignore")
          content=gi.read_text(encoding="utf-8")
          if ".openmontage/" not in content.splitlines():
              gi.write_text(content.rstrip()+"\n\n# Local encrypted provider keys (never commit)\n.openmontage/\n",encoding="utf-8")
          PY
      - name: Install and validate patched application
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pytest -r requirements.txt -r chatgpt_bridge/requirements.txt
          python -m compileall -q chatgpt_bridge
          python -m pytest chatgpt_bridge/tests -q
          python - <<'PY'
          from backlot.server import app
          paths={r.path for r in app.routes}
          assert '/settings/api' in paths and '/settings/api/add' in paths
          from chatgpt_bridge.server import mcp,remote
          assert remote is None
          print("Backlot API page and MCP server registered")
          PY
      - name: Commit verified upgrade to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatgpt_bridge backlot/server.py backlot/ui/index.html .gitignore
          if ! git diff --cached --quiet; then
            git commit -m "feat: secure remote MCP OAuth, API settings vault and Grok integration"
            git push origin HEAD:main
          fi
